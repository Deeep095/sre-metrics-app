apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-app 
  labels:
    app: metrics-app 
spec:

  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: metrics-app 
  template:
    metadata:
      labels:
        app: metrics-app 
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              protocol: TCP
              containerPort: {{ .Values.containerPort }}
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "metrics-app.fullname" . }}
                  key: PASSWORD